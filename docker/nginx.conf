server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # FDR logs and BVR videos can be large.
    client_max_body_size 2048M;
    client_body_timeout 600s;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Static files: built assets, offline map tiles, 3D models.
    location ~ ^/(build|tiles|models)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 600s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
